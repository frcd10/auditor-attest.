services:
  postgres:
    image: postgres:16-alpine
    container_name: auditor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
      POSTGRES_DB: auditor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auditor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor -d auditor"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  auditor-pgdata:
